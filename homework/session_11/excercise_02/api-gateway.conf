server {
    listen 80;
    server_name localhost;

    # 1. Định tuyến cho Backend API Gateway
    location /api/ {
        proxy_pass http://localhost:8080;
        
        # Giữ nguyên các Header quan trọng khi đẩy request xuống Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Định tuyến cho Frontend (Các request còn lại)
    location / {
        proxy_pass http://localhost:3000;
        
        # Chuyển tiếp Header cho Frontend (nếu cần)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}