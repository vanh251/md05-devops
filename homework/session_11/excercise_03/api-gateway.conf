# Block 1: Bắt các request ở Port 80 (HTTP) và chuyển hướng (Redirect) sang HTTPS
server {
    listen 80;
    server_name api.my-ecommerce.com;

    # Trả về mã 301 (Moved Permanently) kèm URL mới với giao thức https
    return 301 https://$host$request_uri;
}

# Block 2: Xử lý các request ở Port 443 (HTTPS)
server {
    listen 443 ssl;
    server_name api.my-ecommerce.com;

    # Khai báo đường dẫn tới Chứng chỉ SSL và Khóa bí mật (Do Let's Encrypt sinh ra)
    ssl_certificate /etc/letsencrypt/live/[api.my-ecommerce.com/fullchain.pem](https://api.my-ecommerce.com/fullchain.pem);
    ssl_certificate_key /etc/letsencrypt/live/[api.my-ecommerce.com/privkey.pem](https://api.my-ecommerce.com/privkey.pem);

    # Tùy chọn tăng cường bảo mật SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}