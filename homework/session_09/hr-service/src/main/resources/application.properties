spring.application.name=hr-service
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hr_test_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hr_test_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ci_test_password}
# Chỉ dùng update cho bài thực hành; test dùng create-drop trên DB riêng.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
